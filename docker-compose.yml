services:
  db:
    image: postgres:16-alpine
    container_name: bom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: bom
      POSTGRES_DB: bom
    ports:
      - "5432:5432"
    volumes:
      - bom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom -d bom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bom-pgdata:
