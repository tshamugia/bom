services:
  db:
    image: postgres:16-alpine
    container_name: bom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: bom
      POSTGRES_DB: bom
    ports:
      - "5432:5432"
    volumes:
      - bom-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom -d bom"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: bom-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bom-miniodata:/data

volumes:
  bom-pgdata:
  bom-miniodata:
