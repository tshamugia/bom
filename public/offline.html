<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#151b27" />
    <title>Offline · Revline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #151b27;
        color: #e8ebf1;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      .card { max-width: 380px; }
      .logo { display: block; width: 56px; height: 56px; margin: 0 auto 20px; }
      h1 { font-size: 20px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 14px; line-height: 1.55; color: #a9b1c0; margin: 0 0 24px; }
      button {
        appearance: none;
        border: 0;
        cursor: pointer;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        color: #fff;
        background: #1f5fd1;
      }
      button:hover { background: #194fb2; }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- The Revline mark (src/lib/brand.ts). -->
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#1f5fd1" />
        <path d="M15 14H27A12 12 0 0 1 30.38 37.51L34.5 43H49V50H31L22 38V50H15ZM22 21V31H27A5 5 0 0 0 27 21Z" fill="#fff" />
      </svg>
      <h1>You're offline</h1>
      <p>Revline needs a connection to load this page. Check your network and try again.</p>
      <button type="button" onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
